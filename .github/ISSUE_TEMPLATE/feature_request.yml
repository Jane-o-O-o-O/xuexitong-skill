name: 功能建议
description: 描述希望改进的学习通使用场景。
title: "[Feature] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在学习通中想完成什么？现在需要怎样操作？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 希望 Agent 或 CLI 接收什么输入、给出什么结果？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有方式与补充信息
      description: 是否尝试过现有命令？请勿提供账号凭据或个人资料。
